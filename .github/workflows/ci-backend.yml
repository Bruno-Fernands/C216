# ============================================================================
# CI - Backend C216
# Roda os testes unitários e de integração do backend (Pytest), em jobs
# separados, e valida o build da imagem Docker.
# Executa em `push` e `pull_request`.
# ============================================================================

name: CI - Backend

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Testes unitários (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar e configurar o Poetry
        run: |
          pip install poetry==2.4.3
          poetry config virtualenvs.in-project true

      - name: Instalar dependências com Poetry
        run: poetry install

      - name: Executar os testes unitários com Pytest
        run: poetry run pytest tests/unit -v

  integration-tests:
    name: Testes de integração (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar e configurar o Poetry
        run: |
          pip install poetry==2.4.3
          poetry config virtualenvs.in-project true

      - name: Instalar dependências com Poetry
        run: poetry install

      - name: Executar os testes de integração com Pytest
        run: poetry run pytest tests/integration -v

  build-image:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem do backend
        run: docker compose build backend