# ============================================================================
# CI - Frontend C216
# Lint/formatação (Biome), testes unitários e de integração (Vitest),
# build (Vite) e testes E2E (Playwright). Executa em `push` e `pull_request`.
# ============================================================================

name: CI - Frontend

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Verificar formatação (Biome)
        run: npm run format:check

      - name: Testes unitários e de integração (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
