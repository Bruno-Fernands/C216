[project]
name = "c216-backend"
version = "0.1.0"
description = "Backend da disciplina C216 - Sistemas Distribuídos (L1)"
authors = [
    {name = "Bruno Fernandes",email = "111819744+Bruno-Fernands@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "alembic (>=1.14,<2.0)",
    "pydantic-settings (>=2.6,<3.0)"
]

[tool.poetry]
# O backend é um aplicativo (não uma biblioteca a ser publicada),
# então não instalamos o projeto em si como pacote.
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations são geradas pelo Alembic e seguem o formato dele.
"alembic/versions/*" = ["E501"]
